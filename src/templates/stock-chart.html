<html>
  <head>
    <style>
      :root {
        --main-color: {{MAIN_COLOR}};
        --glow-color: {{GLOW_COLOR}};
        --icon-gradient-start: {{ICON_GRADIENT_START}};
        --icon-gradient-end: {{ICON_GRADIENT_END}};
        --icon-shadow: {{ICON_SHADOW}};
        --change-badge-bg: {{CHANGE_BADGE_BG}};

        --bg-color: #0c0f15;
        --card-bg: #161b22;
        --item-bg: #1f242e;
        --text-primary: #f0f3f5;
        --text-secondary: #8b949e;
        --border-color: #30363d;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        padding: 64px;
        font-family: 'Roboto Mono', 'Trebuchet MS', 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        width: 1024px;
        height: 768px;
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      .card {
        background-color: var(--card-bg);
        width: 100%;
        height: 100%;
        padding: 32px 40px;
        border-radius: 16px;
        box-shadow: 0 32px 64px rgba(0,0,0,0.6), 0 0 0 1px var(--border-color);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
        flex-shrink: 0;
      }

      .title-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .stock-name {
        font-size: 42px;
        font-weight: 700;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .stock-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--icon-gradient-start), var(--icon-gradient-end));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: 0 8px 20px var(--icon-shadow);
      }

      .meta-info {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 15px;
        color: var(--text-secondary);
        font-weight: 500;
        margin-left: 60px;
      }

      .meta-item { display: flex; align-items: center; gap: 6px; }
      .live-dot { width: 6px; height: 6px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

      .price-group { text-align: right; }

      .current-price {
        font-family: 'Roboto Mono', 'Trebuchet MS', monospace;
        font-size: 64px;
        font-weight: normal;
        color: var(--main-color);
        line-height: 1;
        letter-spacing: 0;
      }

      .price-change {
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
      }

      .change-badge {
        background-color: var(--change-badge-bg);
        color: var(--main-color);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .chart-wrapper {
        position: relative;
        flex: 1;
        width: 100%;
        min-height: 0;
        margin: 16px 0;
        border-radius: 12px;
        overflow: hidden;
        background: #121722;
      }

      #chart {
        width: 100%;
        height: 100%;
      }

      .chart-error {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        font-size: 16px;
      }

      .footer {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        background: var(--card-bg);
        border-top: 1px solid var(--border-color);
        margin-top: auto;
        padding-top: 24px;
        flex-shrink: 0;
      }

      .stat-box {
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border-color);
      }
      .stat-box:last-child { border-right: none; }

      .stat-label {
        font-size: 13px;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
        font-weight: 600;
      }

      .stat-value {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
        font-family: 'Roboto Mono', monospace;
        letter-spacing: 0;
      }

      .update-time {
        position: absolute;
        bottom: 8px;
        right: 8px;
        font-size: 12px;
        color: var(--text-secondary);
        opacity: 0.9;
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="title-group">
          <div class="stock-name">
            <div class="stock-icon">¥</div>
            {{STOCK_NAME}}
          </div>
          <div class="meta-info">
            <div class="meta-item">
              <div class="live-dot"></div>
              {{VIEW_LABEL}}
            </div>
            <div class="meta-item" style="opacity: 0.5">|</div>
            <div class="meta-item">{{CURRENT_TIME}}</div>
          </div>
        </div>
        <div class="price-group">
          <div class="current-price">{{CURRENT_PRICE}}</div>
          <div class="price-change">
            <span
              style="
                font-size: 18px;
                font-weight: 600;
                color: var(--main-color);
                opacity: 0.9;
              "
              >{{CHANGE_VALUE}}</span
            >
            <span class="change-badge"
              >{{CHANGE_ICON}} {{CHANGE_PERCENT}}%</span
            >
          </div>
        </div>
      </div>

      <div class="chart-wrapper">
        <div id="chart"></div>
      </div>

      <div class="footer">
        <div class="stat-box">
          <div class="stat-label">High</div>
          <div class="stat-value">{{HIGH_PRICE}}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Low</div>
          <div class="stat-value">{{LOW_PRICE}}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Open</div>
          <div class="stat-value">{{START_PRICE}}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Amp</div>
          <div class="stat-value">{{AMPLITUDE}}%</div>
        </div>
      </div>
      <div class="update-time">Updated {{UPDATE_TIME}}</div>
    </div>

    <script>
      const chartType = "{{CHART_TYPE}}";
      const klineData = JSON.parse("{{KLINE_DATA}}");
      const prices = JSON.parse("{{PRICES}}");
      const times = JSON.parse("{{TIMES}}");
      const timestamps = JSON.parse("{{TIMESTAMPS}}");
      const riseColor = "#f23645";
      const fallColor = "#089981";

      function markReady(className) {
        document.body.classList.add(className || "chart-ready");
      }

      function showError(message) {
        const wrapper = document.querySelector(".chart-wrapper");
        const error = document.createElement("div");
        error.className = "chart-error";
        error.textContent = message;
        wrapper.appendChild(error);
        markReady("chart-ready");
      }

      function renderLineChart() {
        const wrapper = document.querySelector(".chart-wrapper");
        const canvas = document.createElement("canvas");
        const dpr = window.devicePixelRatio || 1;
        const rect = wrapper.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        document.getElementById("chart").appendChild(canvas);

        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);

        const W = rect.width;
        const H = rect.height;
        const padding = { top: 22, bottom: 34, left: 8, right: 72 };
        const maxPrice = Math.max(...prices);
        const minPrice = Math.min(...prices);
        const priceRange = maxPrice - minPrice || 1;
        const yMin = minPrice - priceRange * 0.2;
        const yMax = maxPrice + priceRange * 0.2;
        const yRange = yMax - yMin || 1;
        const tStart = timestamps[0];
        const tEnd = timestamps[timestamps.length - 1];
        const tRange = tEnd - tStart || 1;
        const getX = (t) =>
          padding.left +
          ((t - tStart) / tRange) * (W - padding.left - padding.right);
        const getY = (p) =>
          H -
          padding.bottom -
          ((p - yMin) / yRange) * (H - padding.top - padding.bottom);

        ctx.strokeStyle = "rgba(48, 54, 61, 0.75)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        for (let i = 0; i <= 4; i++) {
          const y =
            H - padding.bottom - (i / 4) * (H - padding.top - padding.bottom);
          ctx.beginPath();
          ctx.moveTo(padding.left, y);
          ctx.lineTo(W - padding.right, y);
          ctx.stroke();

          const val = yMin + (i / 4) * yRange;
          ctx.fillStyle = "#64748b";
          ctx.font = '12px "Trebuchet MS", monospace';
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText(val.toFixed(2), W - padding.right + 10, y);
        }
        ctx.setLineDash([]);

        const points = prices.map((price, index) => ({
          x: getX(timestamps[index]),
          y: getY(price),
        }));

        const gradient = ctx.createLinearGradient(
          0,
          padding.top,
          0,
          H - padding.bottom,
        );
        gradient.addColorStop(0, "{{GRADIENT_START}}");
        gradient.addColorStop(1, "rgba(0,0,0,0)");

        ctx.beginPath();
        ctx.moveTo(points[0].x, H - padding.bottom);
        ctx.lineTo(points[0].x, points[0].y);
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const midX = (p0.x + p1.x) / 2;
          const midY = (p0.y + p1.y) / 2;
          ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
        }
        const lastPoint = points[points.length - 1];
        ctx.lineTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(lastPoint.x, H - padding.bottom);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        ctx.beginPath();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "{{MAIN_COLOR}}";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[i];
          const p1 = points[i + 1];
          const midX = (p0.x + p1.x) / 2;
          const midY = (p0.y + p1.y) / 2;
          ctx.quadraticCurveTo(p0.x, p0.y, midX, midY);
        }
        ctx.lineTo(lastPoint.x, lastPoint.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.setLineDash([3, 5]);
        ctx.strokeStyle = "{{MAIN_COLOR}}";
        ctx.lineWidth = 1;
        ctx.moveTo(padding.left, lastPoint.y);
        ctx.lineTo(W - padding.right, lastPoint.y);
        ctx.stroke();
        ctx.setLineDash([]);

        const currentPriceStr = prices[prices.length - 1].toFixed(2);
        ctx.font = 'bold 13px "Trebuchet MS", monospace';
        const labelWidth = ctx.measureText(currentPriceStr).width + 18;
        const labelHeight = 24;
        const labelX = W - padding.right;
        const labelY = Math.max(
          padding.top,
          Math.min(
            H - padding.bottom - labelHeight,
            lastPoint.y - labelHeight / 2,
          ),
        );
        ctx.fillStyle = "{{MAIN_COLOR}}";
        ctx.beginPath();
        ctx.roundRect(labelX, labelY, labelWidth, labelHeight, 5);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(currentPriceStr, labelX + 9, labelY + labelHeight / 2);

        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(lastPoint.x, lastPoint.y, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#64748b";
        ctx.font =
          '12px -apple-system, BlinkMacSystemFont, "Inter", sans-serif';
        const labelIndexes = [
          0,
          Math.floor((times.length - 1) / 2),
          times.length - 1,
        ];
        for (const index of labelIndexes) {
          ctx.fillText(
            times[index],
            getX(timestamps[index]),
            H - padding.bottom + 12,
          );
        }

        markReady("chart-ready");
      }

      function loadG2() {
        if (window.G2 && window.G2.Chart) return Promise.resolve();
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://unpkg.com/@antv/g2@5.4.8/dist/g2.min.js";
          script.onload = resolve;
          script.onerror = () => reject(new Error("AntV G2 加载失败"));
          document.head.appendChild(script);
        });
      }

      async function renderKLineChart() {
        await loadG2();
        if (!window.G2 || !window.G2.Chart) {
          throw new Error("AntV G2 加载失败");
        }

        const chart = new G2.Chart({
          container: "chart",
          autoFit: true,
        });

        chart.options({
          type: "view",
          data: klineData,
          theme: "classicDark",
          encode: {
            x: "timeKey",
            color: (d) => {
              if (d.end > d.start) return "rise";
              if (d.end < d.start) return "fall";
              return "flat";
            },
          },
          marginLeft: 12,
          marginRight: 72,
          marginTop: 24,
          marginBottom: 44,
          scale: {
            x: {
              padding: 0.35,
              compare: (a, b) => new Date(a).getTime() - new Date(b).getTime(),
            },
            y: { nice: true },
            color: {
              domain: ["fall", "flat", "rise"],
              range: [fallColor, "#999999", riseColor],
            },
          },
          axis: {
            x: {
              title: false,
              tick: false,
              labelFill: "#64748b",
              labelFontSize: 12,
              labelFormatter: (value) => {
                const index = klineData.findIndex(
                  (item) => item.timeKey === value,
                );
                if (index === -1) return "";
                if (index === 0 || index === klineData.length - 1)
                  return klineData[index].time;
                const step = Math.max(1, Math.ceil(klineData.length / 5));
                return index % step === 0 ? klineData[index].time : "";
              },
            },
            y: {
              position: "right",
              title: false,
              labelFill: "#64748b",
              labelFontSize: 12,
              labelFormatter: (value) => Number(value).toFixed(2),
            },
          },
          children: [
            {
              type: "link",
              encode: {
                y: ["min", "max"],
              },
              style: {
                lineWidth: 1.5,
              },
            },
            {
              type: "interval",
              encode: {
                y: ["start", "end"],
              },
              style: {
                stroke: (d) =>
                  d.end > d.start
                    ? riseColor
                    : d.end < d.start
                      ? fallColor
                      : "#999999",
                fillOpacity: 1,
                lineWidth: 1,
                maxWidth: 14,
                minWidth: 4,
              },
            },
          ],
          tooltip: false,
          legend: false,
          viewStyle: {
            viewFill: "#121722",
          },
        });

        chart
          .render()
          .then(() => markReady("chart-ready"))
          .catch((err) => showError(err.message || "K线图渲染失败"));
      }

      try {
        if (chartType === "line") {
          renderLineChart();
        } else {
          renderKLineChart().catch((err) =>
            showError(err.message || "K线图渲染失败"),
          );
        }
      } catch (err) {
        showError(err.message || "图表渲染失败");
      }
    </script>
  </body>
</html>
