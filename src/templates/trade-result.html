<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    {{FONT_FACE}}

    :root {
      --bg-color: #0c0f15;
      --card-bg: #161b22;
      --item-bg: #1f242e;
      --text-primary: #f0f3f5;
      --text-secondary: #8b949e;
      --border-color: #30363d;

      /* 语义色 */
      --buy-color: #f87171;
      /* 涨/买 */
      --sell-color: #4ade80;
      /* 跌/卖 */
      --buy-bg: rgba(248, 113, 113, 0.15);
      --sell-bg: rgba(74, 222, 128, 0.15);

      --pending-color: #eab308;
      /* 黄色 */
      --pending-bg: rgba(234, 179, 8, 0.15);

      --accent-color: #58a6ff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 64px;
      font-family: 'Roboto Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg-color);
      width: 960px;
      height: 720px;
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      height: 100%;
      padding: 32px 40px;
      border-radius: 16px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* --- 顶部区域：股票信息 + 价格 --- */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 24px;
    }

    .stock-group {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
      flex-shrink: 1;
    }

    .stock-icon {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2b313a, #1f242e);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .stock-icon img {
      width: 32px;
      height: 32px;
      display: block;
    }

    .stock-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 0;
    }

    .stock-name {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 徽标容器 */
    .badges-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1;
      white-space: nowrap;
    }

    .badge.buy {
      background: var(--buy-bg);
      color: var(--buy-color);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }

    .badge.sell {
      background: var(--sell-bg);
      color: var(--sell-color);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .badge.pending {
      background: var(--pending-bg);
      color: var(--pending-color);
      border: 1px solid rgba(234, 179, 8, 0.2);
    }

    .badge.pending::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .price-group {
      text-align: right;
      flex-shrink: 0;
    }

    .main-price {
      font-size: 56px;
      font-weight: 500;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 8px;
      font-family: 'Roboto Mono';
    }

    .main-price.buy {
      color: var(--buy-color);
    }

    .main-price.sell {
      color: var(--sell-color);
    }

    .sub-detail {
      font-size: 16px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sub-detail span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .val-highlight {
      color: var(--text-primary);
      font-weight: 600;
      font-family: 'Roboto Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    .price-breakdown-text {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* --- 图表区域 --- */
    .chart-wrapper {
      flex: 1;
      width: 100%;
      min-height: 0;
      margin-bottom: 24px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* --- 底部数据卡片 --- */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      min-height: 100px;
      max-height: 140px;
    }

    .stats-grid.sell-grid {
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
    }

    .stat-item {
      background: var(--item-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      min-width: 0;
      overflow: hidden;
    }

    .stat-item.highlight {
      background: rgba(88, 166, 255, 0.05);
      border-color: rgba(88, 166, 255, 0.2);
    }

    .stat-item.profit {
      background: rgba(248, 113, 113, 0.05);
      border-color: rgba(248, 113, 113, 0.2);
    }

    .stat-item.loss {
      background: rgba(74, 222, 128, 0.05);
      border-color: rgba(74, 222, 128, 0.2);
    }

    .stat-label {
      font-size: 14px;
      text-transform: uppercase;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      font-family: 'Roboto Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .stat-value.profit {
      color: var(--buy-color);
    }

    .stat-value.loss {
      color: var(--sell-color);
    }

    .stat-sub {
      font-size: 13px;
      color: var(--text-secondary);
      opacity: 0.8;
      margin-top: 4px;
      font-family: 'Roboto Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 底部时间戳 */
    .footer-meta {
      position: absolute;
      bottom: 0px;
      right: 0px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .time-tag {
      font-size: 12px;
      color: var(--text-secondary);
      padding: 6px 8px;
      border-radius: 6px;
      font-family: 'Roboto Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>

<body>
  <div class="card">
    <!-- 顶部信息栏 -->
    <div class="top-section">
      <div class="stock-group">
        <div class="stock-icon"><img src="{{ICON_STOCK}}" alt="" /></div>
        <div class="stock-meta">
          <div class="stock-name" id="stock-name">--</div>
          <div class="badges-container" id="badges-container"></div>
        </div>
      </div>

      <div class="price-group">
        <div class="main-price" id="trade-price"></div>
        <div class="sub-detail">
          <span id="price-breakdown"></span>
          <span class="detail-sep" style="opacity: 0.2">|</span>
          <span>数量 <b class="val-highlight" id="trade-amount"></b></span>
        </div>
      </div>
    </div>

    <!-- 图表区域 -->
    <div class="chart-wrapper" id="chart-container">
      <canvas id="chart"></canvas>
    </div>

    <!-- 底部数据 -->
    <div class="stats-grid" id="stats-grid">
      <!-- JS填充 -->
    </div>

    <!-- 仅用于显示时间，不干扰布局 -->
    <div class="footer-meta">
      <div class="time-tag" id="trade-time">--</div>
    </div>
  </div>

  <!-- 数据源 -->
  <script type="application/json" id="data-source">
{{DATA}}
  </script>

  <script>
    let DATA;
    try {
      DATA = JSON.parse(document.getElementById('data-source').textContent);
    } catch (e) {
      DATA = typeof TEST_DATA !== 'undefined' ? TEST_DATA : {};
    }

    const isBuy = DATA.tradeType === 'buy';
    const status = DATA.status || 'settled';
    const isPending = status === 'pending';
    const mainColor = isBuy ? '#f87171' : '#4ade80';

    // ============================================================
    // 动态样式调整系统
    // ============================================================

    /**
     * 测量文本在给定字号下的宽度
     */
    function measureTextWidth(text, fontSize, fontWeight, fontFamily) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      ctx.font = `${fontWeight} ${fontSize}px ${fontFamily || "'Roboto Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif"}`;
      return ctx.measureText(text).width;
    }

    /**
     * 根据容器宽度和文本内容，计算合适的字号
     * @param {string} text - 文本内容
     * @param {number} containerWidth - 容器可用宽度
     * @param {number} baseFontSize - 基准字号
     * @param {number} minFontSize - 最小字号
     * @param {number} fontWeight - 字重
     * @returns {number} 合适的字号
     */
    function calcFontSize(text, containerWidth, baseFontSize, minFontSize, fontWeight = 700) {
      let fontSize = baseFontSize;
      const fontFamily = "'Roboto Mono', 'PingFang SC', 'Microsoft YaHei', sans-serif";

      // 逐步缩小字号直到文本适合容器
      while (fontSize > minFontSize) {
        const textWidth = measureTextWidth(text, fontSize, fontWeight, fontFamily);
        if (textWidth <= containerWidth) {
          return fontSize;
        }
        fontSize -= 1;
      }
      return minFontSize;
    }

    /**
     * 功态调整底部数据卡片
     * 根据最长的标签和值来统一调整所有卡片的字号
     */
    function adjustStatsGrid() {
      const grid = document.getElementById('stats-grid');
      const items = grid.querySelectorAll('.stat-item');
      if (items.length === 0) return;

      const isSellGrid = grid.classList.contains('sell-grid');
      const gap = isSellGrid ? 12 : 16;
      const totalGap = gap * (items.length - 1);
      const gridPadding = 0; // grid 本身没有 padding
      const availableWidth = (grid.offsetWidth - totalGap) / items.length;

      // 收集所有标签和值的文本
      const labelTexts = [];
      const valueTexts = [];
      const subTexts = [];

      items.forEach(item => {
        const label = item.querySelector('.stat-label');
        const value = item.querySelector('.stat-value');
        const sub = item.querySelector('.stat-sub');
        if (label) labelTexts.push(label.textContent);
        if (value) valueTexts.push(value.textContent);
        if (sub) subTexts.push(sub.textContent);
      });

      // 计算最长的标签文本
      const maxLabelWidth = Math.max(...labelTexts.map(t => measureTextWidth(t, 14, 600)));
      const maxLabelLength = Math.max(...labelTexts.map(t => t.length));

      // 计算最长的值文本
      const maxValueWidth = Math.max(...valueTexts.map(t => measureTextWidth(t, 26, 700)));
      const maxValueLength = Math.max(...valueTexts.map(t => t.length));

      // 计算最长的 sub 文本
      const maxSubWidth = Math.max(...subTexts.map(t => measureTextWidth(t, 13, 400)));

      // 内边距
      const itemPaddingH = 32; // padding-left + padding-right (16+16)
      const contentWidth = availableWidth - itemPaddingH;

      // 动态调整字号
      let labelFontSize = 14;
      let valueFontSize = 26;
      let subFontSize = 13;
      let marginBottom = 8;

      // 标签字号调整
      if (maxLabelWidth > contentWidth) {
        labelFontSize = calcFontSize(
          labelTexts.reduce((a, b) => a.length > b.length ? a : b),
          contentWidth,
          14,
          10,
          600
        );
      }

      // 值字号调整
      if (maxValueWidth > contentWidth) {
        valueFontSize = calcFontSize(
          valueTexts.reduce((a, b) => a.length > b.length ? a : b),
          contentWidth,
          26,
          16,
          700
        );
      }

      // sub 字号调整
      if (maxSubWidth > contentWidth) {
        subFontSize = calcFontSize(
          subTexts.reduce((a, b) => a.length > b.length ? a : b),
          contentWidth,
          13,
          10,
          400
        );
      }

      // 如果值字号缩小了，标签和间距也要相应缩小
      if (valueFontSize < 26) {
        marginBottom = Math.max(4, marginBottom - (26 - valueFontSize));
      }

      // 应用样式
      items.forEach(item => {
        const label = item.querySelector('.stat-label');
        const value = item.querySelector('.stat-value');
        const sub = item.querySelector('.stat-sub');

        if (label) {
          label.style.fontSize = labelFontSize + 'px';
          label.style.marginBottom = marginBottom + 'px';
        }
        if (value) {
          value.style.fontSize = valueFontSize + 'px';
        }
        if (sub) {
          sub.style.fontSize = subFontSize + 'px';
        }
      });

      // 调整网格高度
      const totalHeight = labelFontSize + marginBottom + valueFontSize + 4 + subFontSize + 28; // 28 = padding
      grid.style.minHeight = Math.max(80, totalHeight) + 'px';
      grid.style.maxHeight = Math.max(100, totalHeight + 20) + 'px';
    }

    /**
     * 动态调整顶部区域
     */
    function adjustTopSection() {
      const stockName = document.getElementById('stock-name');
      const mainPrice = document.getElementById('trade-price');
      const subDetail = document.querySelector('.sub-detail');

      // 股票名称字号调整
      const stockNameContainer = stockName.parentElement;
      const stockNameWidth = stockNameContainer.offsetWidth;
      const stockNameTextWidth = measureTextWidth(stockName.textContent, 28, 700);
      if (stockNameTextWidth > stockNameWidth) {
        const newFontSize = calcFontSize(stockName.textContent, stockNameWidth, 28, 18, 700);
        stockName.style.fontSize = newFontSize + 'px';
      }

      // 主价格字号调整
      const priceGroup = mainPrice.parentElement;
      const priceGroupWidth = priceGroup.offsetWidth;
      const priceTextWidth = measureTextWidth(mainPrice.textContent, 56, 500);
      if (priceTextWidth > priceGroupWidth) {
        const newFontSize = calcFontSize(mainPrice.textContent, priceGroupWidth, 56, 32, 500);
        mainPrice.style.fontSize = newFontSize + 'px';
        mainPrice.style.letterSpacing = (newFontSize < 40) ? '-1px' : '-2px';
      }

      // sub-detail 区域：如果内容太长，缩小字号或隐藏分隔符
      if (subDetail) {
        const subDetailWidth = subDetail.offsetWidth;
        const subDetailScrollWidth = subDetail.scrollWidth;

        if (subDetailScrollWidth > subDetailWidth) {
          // 先尝试缩小字号
          const currentFontSize = parseFloat(getComputedStyle(subDetail).fontSize);
          const newFontSize = Math.max(11, currentFontSize - 2);
          subDetail.style.fontSize = newFontSize + 'px';

          // 如果还是太长，隐藏 price-breakdown
          if (subDetail.scrollWidth > subDetailWidth) {
            const priceBreakdown = document.getElementById('price-breakdown');
            if (priceBreakdown) {
              priceBreakdown.style.display = 'none';
              const seps = subDetail.querySelectorAll('.detail-sep');
              if (seps.length > 0) {
                seps[0].style.display = 'none';
              }
            }
          }
        }
      }
    }

    /**
     * 动态调整徽标
     */
    function adjustBadges() {
      const badgesContainer = document.getElementById('badges-container');
      const badges = badgesContainer.querySelectorAll('.badge');
      const containerWidth = badgesContainer.offsetWidth;

      let totalWidth = 0;
      badges.forEach(badge => {
        totalWidth += badge.offsetWidth + 8; // 8 = gap
      });

      if (totalWidth > containerWidth) {
        badges.forEach(badge => {
          const currentFontSize = parseFloat(getComputedStyle(badge).fontSize);
          badge.style.fontSize = Math.max(10, currentFontSize - 2) + 'px';
          badge.style.padding = '4px 8px';
        });
      }
    }

    // ============================================================
    // 渲染逻辑
    // ============================================================

    // --- 1. 渲染顶部基本信息 ---
    document.getElementById('stock-name').textContent = DATA.stockName || 'Unknown Stock';
    document.getElementById('trade-price').textContent = DATA.tradePrice.toFixed(2);
    document.getElementById('trade-price').className = `main-price ${DATA.tradeType}`;
    document.getElementById('trade-amount').textContent = DATA.amount;
    document.getElementById('trade-time').textContent = (isPending ? '下单时间 ' : '交易时间 ') + DATA.tradeTime;

    // 价格分解显示
    const priceBreakdownEl = document.getElementById('price-breakdown');
    if (DATA.deduction && DATA.deduction > 0) {
      const sign = isBuy ? '+' : '-';
      priceBreakdownEl.innerHTML = `市价 ${DATA.marketPrice.toFixed(2)} ${sign}${DATA.deduction.toFixed(2)} ${DATA.deductionLabel}`;
      priceBreakdownEl.className = 'price-breakdown-text';
    }

    // --- 2. 徽标渲染 ---
    const badgesContainer = document.getElementById('badges-container');
    badgesContainer.innerHTML = '';

    // (A) 交易类型徽标
    const typeBadge = document.createElement('div');
    typeBadge.className = `badge ${DATA.tradeType}`;
    typeBadge.innerHTML = isBuy ? 'BUY / 买入' : 'SELL / 卖出';
    badgesContainer.appendChild(typeBadge);

    // (B) 状态徽标
    if (isPending) {
      const pendingBadge = document.createElement('div');
      pendingBadge.className = 'badge pending';
      const pendingText = DATA.pendingEndTime
        ? `PENDING 预计 ${DATA.pendingEndTime} 完成`
        : 'PENDING 挂单处理中';
      pendingBadge.innerHTML = pendingText;
      badgesContainer.appendChild(pendingBadge);
    }

    // --- 3. 底部数据卡片渲染 ---
    const statsGrid = document.getElementById('stats-grid');
    if (isBuy) {
      statsGrid.innerHTML = `
        <div class="stat-item highlight">
          <div class="stat-label">Current Holdings 持仓</div>
          <div class="stat-value">${DATA.newHolding}</div>
          <div class="stat-sub">股</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Avg Price 均价</div>
          <div class="stat-value">${DATA.tradePrice.toFixed(2)}</div>
          <div class="stat-sub">${DATA.currency}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Total Value 市值</div>
          <div class="stat-value">${(DATA.newHolding * DATA.tradePrice).toFixed(2)}</div>
          <div class="stat-sub">${DATA.currency}</div>
        </div>
      `;
    } else {
      const profit = DATA.profit;
      const isProfit = profit >= 0;
      const profitClass = isProfit ? 'profit' : 'loss';
      const profitSign = isProfit ? '+' : '';
      const hasFee = DATA.fee !== null && DATA.fee > 0;

      statsGrid.classList.add('sell-grid');
      statsGrid.innerHTML = `
        <div class="stat-item highlight">
          <div class="stat-label">Revenue 卖出金额</div>
          <div class="stat-value">${DATA.totalCost.toFixed(2)}</div>
          <div class="stat-sub">${DATA.currency}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Fee 手续费</div>
          <div class="stat-value">${hasFee ? DATA.fee.toFixed(2) : '--'}</div>
          <div class="stat-sub">${DATA.currency}${hasFee ? ` (${DATA.feePercent}%)` : ''}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">Net 到账</div>
          <div class="stat-value">${(DATA.totalCost - (DATA.fee || 0)).toFixed(2)}</div>
          <div class="stat-sub">${DATA.currency}</div>
        </div>
        <div class="stat-item ${profitClass}">
          <div class="stat-label">P/L 盈亏</div>
          <div class="stat-value ${profitClass}">${profit !== null ? profitSign + profit.toFixed(2) : '--'}</div>
          <div class="stat-sub">${profit !== null ? profitSign + DATA.profitPercent.toFixed(2) + '%' : ''}</div>
        </div>
      `;
    }

    // --- 执行动态调整 ---
    adjustStatsGrid();
    adjustTopSection();
    adjustBadges();

    // --- 4. 图表绘制 ---
    const container = document.getElementById('chart-container');
    const canvas = document.getElementById('chart');
    const rect = container.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 2;

    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;

    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    const W = rect.width;
    const H = rect.height;
    const pad = { top: 30, bottom: 30, left: 10, right: 60 };

    if (DATA.prices && DATA.prices.length > 0) {
      const prices = DATA.prices;
      const minP = Math.min(...prices);
      const maxP = Math.max(...prices);
      const rangeP = maxP - minP || 1;

      const yMin = minP - rangeP * 0.2;
      const yMax = maxP + rangeP * 0.2;
      const yRange = yMax - yMin;

      const stepX = (W - pad.left - pad.right) / (prices.length - 1);

      const getX = i => pad.left + i * stepX;
      const getY = p => H - pad.bottom - ((p - yMin) / yRange) * (H - pad.top - pad.bottom);

      // (A) 绘制网格线
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
      ctx.lineWidth = 1;
      const gridLines = 4;
      for (let i = 0; i <= gridLines; i++) {
        const y = H - pad.bottom - (i / gridLines) * (H - pad.top - pad.bottom);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(W - pad.right, y);
        ctx.stroke();

        const val = yMin + (i / gridLines) * yRange;
        ctx.fillStyle = '#8b949e';
        ctx.font = '500 14px "Roboto Mono", monospace';
        ctx.textAlign = 'left';
        ctx.fillText(val.toFixed(2), W - pad.right + 8, y + 4);
      }

      // (B) 绘制面积图
      const points = prices.map((p, i) => ({ x: getX(i), y: getY(p) }));

      ctx.beginPath();
      ctx.moveTo(points[0].x, H - pad.bottom);
      points.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(points[points.length - 1].x, H - pad.bottom);
      ctx.closePath();

      const gradient = ctx.createLinearGradient(0, pad.top, 0, H - pad.bottom);
      gradient.addColorStop(0, isBuy ? 'rgba(248, 113, 113, 0.25)' : 'rgba(74, 222, 128, 0.25)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fill();

      // (C) 绘制折线
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 0; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }
      ctx.lineTo(points[points.length - 1].x, points[points.length - 1].y);

      ctx.strokeStyle = mainColor;
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.stroke();

      // (D) 绘制交易点
      const tIdx = DATA.tradeIndex !== undefined ? DATA.tradeIndex : points.length - 1;
      const tp = points[tIdx];

      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.moveTo(tp.x, pad.top);
      ctx.lineTo(tp.x, H - pad.bottom);
      ctx.stroke();
      ctx.setLineDash([]);

      const glow = ctx.createRadialGradient(tp.x, tp.y, 0, tp.x, tp.y, 16);
      glow.addColorStop(0, isBuy ? 'rgba(248, 113, 113, 0.6)' : 'rgba(74, 222, 128, 0.6)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, 4, 0, Math.PI * 2);
      ctx.fill();

      // 价格标签 Tag
      const tagText = DATA.tradePrice.toFixed(2);
      ctx.font = 'bold 14px "Roboto Mono", monospace';
      const tm = ctx.measureText(tagText);
      const tagW = tm.width + 16;
      const tagH = 26;
      const tagX = tp.x - tagW / 2;
      const tagY = tp.y - 36;

      ctx.fillStyle = mainColor;
      ctx.beginPath();
      ctx.roundRect(tagX, tagY, tagW, tagH, 4);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(tp.x - 4, tagY + tagH);
      ctx.lineTo(tp.x + 4, tagY + tagH);
      ctx.lineTo(tp.x, tagY + tagH + 4);
      ctx.fill();

      ctx.fillStyle = '#1e232e';
      ctx.textAlign = 'center';
      ctx.fillText(tagText, tp.x, tagY + 17);
    }

  </script>
</body>
